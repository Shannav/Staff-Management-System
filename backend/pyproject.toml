[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailvision-bi"
version = "0.1.0"
description = "RetailVision BI API and camera-worker foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "email-validator>=2.1,<3",
    "fastapi>=0.110,<1",
    "psycopg[binary]>=3.1,<4",
    "pydantic-settings>=2.2,<3",
    "pyjwt>=2.8,<3",
    "redis>=5,<6",
    "sqlalchemy>=2.0,<3",
    "structlog>=24,<26",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.9,<2",
    "pre-commit>=3.7,<5",
    "pytest>=8,<9",
    "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jwt.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
